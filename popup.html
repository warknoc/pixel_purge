<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .status-badge {
      background: #238636;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #21262d;
    }
    .metric-val {
      font-weight: bold;
      color: #58a6ff;
    }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #8b949e;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong>PIXEL PURGE</strong>
    <span class="status-badge" id="shield-status">ACTIVE</span>
  </div>
  <div class="metric-row">
    <span>URL Dirty Params:</span>
    <span class="metric-val" id="param-status">Stripping</span>
  </div>
  <div class="metric-row">
    <span>Ghost Beacon Rule:</span>
    <span class="metric-val">Enforced</span>
  </div>
  <div class="metric-row">
    <span>Network Telemetry:</span>
    <span class="metric-val">Zero / Offline</span>
  </div>
  <div class="footer">
    Client-side native ruleset. No telemetry.
  </div>
  <script src="popup.js"></script>
</body>
</html>
